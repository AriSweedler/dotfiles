bind-key C-c new-window -n "caffeinate" "echo 'Display will not sleep'; caffeinate -d"\; display-message "caffeinate successfully started"

# Control-p is for key forwarding
bind-key C-p new-window 'applepaste $(pbpaste)'

# Control-u opens the URL on the clipboard (e.g. Claude's mermaid.ink links)
bind-key C-u new-window 'zsh -ic claude-link'

# Control-k picks a oneshot command from a fzfdb-style menu and runs it
bind-key C-k display-popup -E -w 80% -h 60% -d "#{pane_current_path}" "~/.config/bin/tmux-oneshot"
