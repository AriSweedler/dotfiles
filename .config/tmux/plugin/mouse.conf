# Native-feel mouse selection: double-click selects a word, triple-click a
# line, and dragging from either click extends the selection word- or
# line-wise. tmux extends drags this way natively, but only while the
# select-word/select-line selection is still alive in copy mode. The stock
# bindings kill it right after the click with a delayed copy-pipe-and-cancel.
# So: select on click, copy on release.
#
# Gesture timeline (tmux 3.6): the 2nd press fires SecondClick1Pane at once.
# DoubleClick1Pane is synthesized ~300ms later by a timer, and only if no 3rd
# press arrived. A drag can begin before that timer fires. The word selection
# must therefore start at SecondClick, not DoubleClick. TripleClick fires at
# once on the 3rd press. A release fires MouseUp1Pane, or MouseDragEnd1Pane
# if it ends a drag, never both.
#
# The #{||:#{pane_in_mode},#{mouse_any_flag}} guard on each root binding
# passes clicks through to apps that grabbed the mouse (vim, fzf).

bind-key -T root SecondClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-word }
bind-key -T copy-mode-vi SecondClick1Pane select-pane \; send-keys -X select-word

bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-line }
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line

# The default MouseDragEnd1Pane already copies and cancels for drag releases.
# copy-pipe with no selection pipes empty stdin into pbcopy and blanks the
# clipboard, so guard on selection_active.
bind-key -T copy-mode-vi MouseUp1Pane if-shell -F '#{selection_active}' { send-keys -X copy-pipe-and-cancel }

# The timer-synthesized DoubleClick lands ~300ms late. Mid-drag it re-anchors
# the same word, which is harmless. After MouseUp already copied and exited,
# it must not re-enter copy mode, so the root binding only passes through.
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M }

# Apps on the alternate screen that never enabled mouse reporting (less, man)
# drop forwarded mouse events, so the stock alternate_on -> send -M leg makes
# the wheel dead there. Translate the wheel to arrow keys for them instead.
# Apps that did grab the mouse still get raw events via the first leg.
bind-key -T root WheelUpPane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { if-shell -F '#{alternate_on}' { send-keys -N 3 Up } { copy-mode -e } }
bind-key -T root WheelDownPane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { if-shell -F '#{alternate_on}' { send-keys -N 3 Down } { send-keys -M } }

# pbpaste through load-buffer avoids shell quoting entirely. Trackpads emit
# no middle button, so this fires only from a real 3-button mouse.
bind-key -T root MouseDown2Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { run-shell 'pbpaste | tmux load-buffer - && tmux paste-buffer -d -p' }

# Terminal.app has no OSC 52, so copy-pipe with copy-command is the bridge to
# the macOS clipboard.
set-option -s copy-command 'pbcopy'
