# Mouse selection, tuned to feel native: double-click selects a word,
# triple-click a line, and dragging from either click extends the selection
# word-/line-wise. tmux extends drags by word/line natively
# (window_copy_start_drag keeps the select-word/select-line granularity), but
# only while that selection is still alive in copy mode — and the stock
# bindings kill it right after the click with `run -d0.3 ; send -X
# copy-pipe-and-cancel`. So instead: select on click, copy on release.
#
# Gesture timeline (tmux 3.6): the 2nd press fires SecondClick1Pane
# immediately; DoubleClick1Pane is synthesized ~300ms later by a timer, and
# only if no 3rd press arrived. A drag can begin before that timer fires, so
# the word selection must start at SecondClick, not DoubleClick. TripleClick
# fires immediately at the 3rd press. A release fires MouseUp1Pane, or
# MouseDragEnd1Pane if it ends a drag — never both.
#
# The #{||:#{pane_in_mode},#{mouse_any_flag}} guard on every root binding
# passes clicks through to apps that grabbed the mouse (vim, fzf, ...).

# 2nd press: select the word under the cursor. Dragging from here extends
# wordwise via the default copy-mode MouseDrag1Pane -> begin-selection.
bind-key -T root SecondClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-word }
bind-key -T copy-mode-vi SecondClick1Pane select-pane \; send-keys -X select-word

# 3rd press: grow to the whole line; dragging from here extends linewise.
bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-line }
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line

# Release without drag: copy the click-selection and leave copy mode.
# (Release after a drag is MouseDragEnd1Pane, whose default
# copy-pipe-and-cancel already does the same.) The selection_active guard
# keeps a bare click in copy mode from piping an empty selection into pbcopy,
# which would blank the clipboard.
bind-key -T copy-mode-vi MouseUp1Pane if-shell -F '#{selection_active}' { send-keys -X copy-pipe-and-cancel }

# The timer-synthesized DoubleClick lands ~300ms late. Mid-drag it re-anchors
# the same word (harmless). After MouseUp already copied and exited it must
# NOT drop us back into copy mode, so the root binding only passes through.
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M }

# Middle click pastes the macOS clipboard instead of the tmux paste-buffer.
# Piping pbpaste into load-buffer dodges every shell-quoting failure mode.
# (Trackpads emit no middle button; this needs a real 3-button mouse.)
bind-key -T root MouseDown2Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { run-shell 'pbpaste | tmux load-buffer - && tmux paste-buffer -d -p' }

# Right click keeps the tmux 3.6 default: the context menu (copy word/line/
# hyperlink, splits, zoom, ...).

# Every copy path above lands on the macOS clipboard — Terminal.app has no
# OSC 52, so copy-pipe with copy-command is the bridge.
set-option -s copy-command 'pbcopy'
