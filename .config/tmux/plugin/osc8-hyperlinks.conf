# Open OSC 8 hyperlinks (e.g. Claude Code's "View PR") from tmux itself.
# Terminal.app can't render OSC 8 (no version can, incl. Tahoe), but tmux
# stores every link unconditionally and exposes it via #{mouse_hyperlink} /
# #{copy_cursor_hyperlink} — so tmux does the opening, not the terminal.
# `mouse on` lives in settings.conf (sorts after this file, so it must win there).
#
# A tmux-pane://<n>[?cmd=|?run=<percent-encoded>[&interactive=1]] link focuses pane %<n> (and types
# or runs the command) through the ari-driving-tmux skill's focus.zsh, passing the clicked pane so a
# run can return to it (and so focus.zsh can drop a payload clicked outside Claude Code). The URL is
# stripped of its scheme and then shell-quoted as chained modifiers (`s/…//;q:`): a `q:` around a
# nested `#{s/…}` quotes nothing, and the raw URL would reach sh. Its output goes to
# /tmp/ari-driving-focus.log: run-shell output would otherwise pop up over the pane.
#
# A tmux-tooltip://show?… link (printed by `tmux-tooltip link`) carries a read-only card; the click shows
# it just above the link through `tmux-tooltip open`, given the click's client coordinates since a
# run-shell has no mouse event for display-menu's own `-x M`. Log: /tmp/tmux-tooltip.log.

# Keyboard path: <Prefix>[ to enter copy mode, cursor onto the link text, O opens it.
bind-key -T copy-mode-vi O if-shell -F '#{m:tmux-pane://*,#{copy_cursor_hyperlink}}' {
  run-shell -b 'zsh "$HOME/.claude/skills/ari-driving-tmux/bin/focus.zsh" --pane #{s/^tmux-pane...//;q:copy_cursor_hyperlink} --return-pane #{pane_id} >>/tmp/ari-driving-focus.log 2>&1'
  send-keys -X cancel
} {
  if-shell -F '#{m:tmux-tooltip://*,#{copy_cursor_hyperlink}}' {
    run-shell -b 'zsh "$HOME/.config/bin/tmux-tooltip" open --url #{q:copy_cursor_hyperlink} --client #{q:client_name} --x #{e|+:#{pane_left},#{copy_cursor_x}} --y #{e|+:#{pane_top},#{copy_cursor_y}} >>/tmp/tmux-tooltip.log 2>&1'
    send-keys -X cancel
  } {
    if-shell -F '#{copy_cursor_hyperlink}' {
      run-shell -b 'open #{q:copy_cursor_hyperlink}'   # #{q:...} shell-escapes the URL
      send-keys -X cancel
    } {
      display-message 'No hyperlink under cursor'
    }
  }
}

# Mouse path: a plain click on a link opens it. Anything else passes through.
# Root MouseUp1Pane is unbound by default, so click-to-focus, drag-to-copy,
# and the right-click menu keep default behavior. Double and triple click
# selection lives in mouse.conf.
bind-key -T root MouseUp1Pane if-shell -F '#{m:tmux-pane://*,#{mouse_hyperlink}}' {
  run-shell -b 'zsh "$HOME/.claude/skills/ari-driving-tmux/bin/focus.zsh" --pane #{s/^tmux-pane...//;q:mouse_hyperlink} --return-pane #{pane_id} >>/tmp/ari-driving-focus.log 2>&1'
} {
  if-shell -F '#{m:tmux-tooltip://*,#{mouse_hyperlink}}' {
    run-shell -b 'zsh "$HOME/.config/bin/tmux-tooltip" open --url #{q:mouse_hyperlink} --client #{q:client_name} --x #{e|+:#{pane_left},#{mouse_x}} --y #{e|+:#{pane_top},#{mouse_y}} >>/tmp/tmux-tooltip.log 2>&1'
  } {
    if-shell -F '#{mouse_hyperlink}' {
      run-shell -b 'open #{q:mouse_hyperlink}'
    } {
      send-keys -M
    }
  }
}
