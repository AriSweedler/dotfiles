# Open OSC 8 hyperlinks (e.g. Claude Code's "View PR") from tmux itself.
# Terminal.app can't render OSC 8 (no version can, incl. Tahoe), but tmux
# stores every link unconditionally and exposes it via #{mouse_hyperlink} /
# #{copy_cursor_hyperlink} — so tmux does the opening, not the terminal.
# `mouse on` lives in settings.conf (sorts after this file, so it must win there).

# Keyboard path: <Prefix>[ to enter copy mode, cursor onto the link text, O opens it.
bind-key -T copy-mode-vi O if-shell -F '#{copy_cursor_hyperlink}' {
  run-shell -b 'open #{q:copy_cursor_hyperlink}'   # #{q:...} shell-escapes the URL
  send-keys -X cancel
} {
  display-message 'No hyperlink under cursor'
}

# Mouse path: plain click on a link opens it; anything else passes through.
# MouseUp1Pane is unbound by default, so click-to-focus, drag-to-copy,
# double/triple-click, and the right-click menu all keep default behavior.
bind-key -T root MouseUp1Pane if-shell -F '#{mouse_hyperlink}' {
  run-shell -b 'open #{q:mouse_hyperlink}'
} {
  send-keys -M
}

# Mouse selections (drag / double-click word / triple-click line) go to the
# macOS clipboard — Terminal.app has no OSC 52, so copy-pipe is the bridge.
set-option -s copy-command 'pbcopy'
