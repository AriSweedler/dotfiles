# Dim every pane further when this tmux's terminal loses focus. In tmux over ssh, the outer tmux
# sends a focus-out when its pane goes inactive, but the inner tmux paints its panes with explicit
# colours that the outer window-style cannot dim.
#   machine active,   pane active:   bg=colour235 (typhon's window-active-style)
#   machine active,   pane inactive: bg=colour238 (typhon's window-style)
#   machine inactive, pane active:   bg=colour239
#   machine inactive, pane inactive: bg=colour240
# Loaded after typhon, so the saved styles are typhon's; a later bg= in a style overrides an
# earlier one, so focus-out keeps typhon's fg.
set -gF @machine-focused-active-style "#{window-active-style}"
set -gF @machine-focused-style "#{window-style}"
set-hook -g client-focus-out {
  set -gF window-active-style "#{@machine-focused-active-style},bg=colour239"
  set -gF window-style "#{@machine-focused-style},bg=colour240"
}
set-hook -g client-focus-in {
  set -gF window-active-style "#{@machine-focused-active-style}"
  set -gF window-style "#{@machine-focused-style}"
}
