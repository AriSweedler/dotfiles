# Pane backgrounds by which machine has the keyboard, for tmux inside tmux over ssh:
#   machine active,   pane active:   typhon's window-active-style (bg=colour235)
#   machine active,   pane inactive: typhon's window-style (bg=colour238)
#   machine inactive, pane active:   @machine-dim-active-bg
#   machine inactive, pane inactive: @machine-dim-bg
# The two colours are set here and nowhere else; the test reads them from tmux.
set -g @machine-dim-active-bg colour239
set -g @machine-dim-bg colour243

# The inner tmux paints its panes with explicit colours that the outer window-style cannot dim,
# so each tmux dims itself. Loaded after typhon, so the saved styles are typhon's; a later bg= in
# a style overrides an earlier one, so typhon's fg stays. Sourced while unfocused, the current
# styles carry the dim bg; the s/// strips it so focus-in never restores the dim.
set -gF @machine-focused-active-style "#{s/,bg=#{@machine-dim-active-bg}$//:window-active-style}"
set -gF @machine-focused-style "#{s/,bg=#{@machine-dim-bg}$//:window-style}"

# The inner tmux: the outer one sends a focus-out when the ssh pane goes inactive (focus-events).
# The outer tmux gets the same from the terminal when its window loses focus.
set-hook -g client-focus-out {
  set -gF window-active-style "#{@machine-focused-active-style},bg=#{@machine-dim-active-bg}"
  set -gF window-style "#{@machine-focused-style},bg=#{@machine-dim-bg}"
}
set-hook -g client-focus-in {
  set -gF window-active-style "#{@machine-focused-active-style}"
  set -gF window-style "#{@machine-focused-style}"
}

# The outer tmux: an ssh pane taking focus hands the keyboard to the other machine, so this
# window's other panes are the inactive machine's. A pane that starts ssh while already focused
# changes nothing until focus next moves.
set-hook -g pane-focus-in {
  if -F "#{==:#{pane_current_command},ssh}" {
    set -wF window-style "#{@machine-focused-style},bg=#{@machine-dim-bg}"
  } {
    set -wu window-style
  }
}
