# notify (~/.config/bin/notify): the unread notifications of the machine whose pane has the
# keyboard. M-n opens them in a popup there; the status line shows their count (typhon.conf).
#
# The same binding is on every tmux, so it works through tmux-in-tmux over ssh: on ozone, a pane
# running ssh passes M-n down the connection, and the tmux at the far end (co2's) opens the popup;
# any other pane opens this machine's list (empty on a Mac, where notify posts banners instead).
bind -n M-n if -F '#{==:#{pane_current_command},ssh}' \
  'send-keys M-n' \
  "display-popup -E -T ' notifications ' -b rounded -w 80% -h 60% '~/.config/bin/notify pick'"

# A server that starts (or re-reads this file) recounts from disk: @notify-unread lives in the
# server, the markers on disk.
run-shell -b '~/.config/bin/notify count --tmux >/dev/null 2>&1 || true'
