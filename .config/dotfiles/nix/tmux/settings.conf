# Typed options in tmux.nix set the rest: base-index 1, default-terminal screen-256color,
# default-shell /bin/zsh, focus-events, mouse (for OSC 8 links; native Terminal.app selection is
# View > Allow Mouse Reporting off), history-limit 5000, escape-time 0, vi mode-keys and status-keys.

# No more annoying self-renaming windows
set-option -g allow-rename off

# Give myself 5 seconds (default is 1) to select a pane after running
# 'display-pane' (<Prefix>q by default)
set-option -g display-panes-time 5000

# Big delay allowed between repeated keypresses
# Allows you to press and hold '<' to resize
set -g repeat-time 750
