# Control-k opens the oneshot launcher; its header lists the direct keys.
# Where a picked command runs is $TMUX_ONESHOT_SURFACE: popup_pane (default), popup or window
# (tmux-oneshot --help → Surface). Flip it for every launch: tmux setenv -g TMUX_ONESHOT_SURFACE popup
bind-key C-k display-popup -E -T ' oneshot ' -b rounded -w 80% -h 60% -d "#{pane_current_path}" "~/.config/bin/tmux-oneshot"
