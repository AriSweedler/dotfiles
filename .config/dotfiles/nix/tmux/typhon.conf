# Typhon's default status-right minus the UTC clock, which is a dotfiles script,
# not part of the plugin. Set before tmux.nix runs typhon.tmux (it reads the option at load).
set -g @typhon-status-right "\
#{typhon_style}#{typhon_indicators}\
#{?client_prefix,#[bg=colour92],#[bg=colour245]} \
#h | %a %b %d [UTC #(~/.config/bin/utc-date)] [%Z %I:%M%p] "
