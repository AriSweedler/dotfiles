# Typhon's default status-right minus the UTC clock, which is a dotfiles script,
# not part of the plugin. Set before tmux.nix runs typhon.tmux (it reads the option at load).
# (N) before the host: this machine's unread notifications (notify.conf); nothing at 0.
# The machine's symbol (machine.nix) between the two, before the host; nothing when unset.
set -g @typhon-status-right "\
#{typhon_style}#{typhon_indicators}\
#{?client_prefix,#[bg=colour92],#[bg=colour245]} \
#{?#{&&:#{@notify-unread},#{!=:#{@notify-unread},0}},#[bold](#{@notify-unread})#[nobold] ,}\
#{?#{@machine-symbol},#{@machine-symbol} ,}#h | %a %b %d [UTC #(~/.config/bin/utc-date)] [%Z %I:%M%p] "
