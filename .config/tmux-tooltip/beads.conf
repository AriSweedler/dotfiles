# Config for the bead links that bead_link.zsh (ari-bead-driven-development) builds with tmux-tooltip.
# Colors, one per line: FIELD VALUE COLOR. FIELD is status or priority; VALUE is bd's word for a status,
# or the priority's number (0 for P0). A value with no line here is shown uncolored.
# COLOR: red green yellow blue magenta cyan white gray orange dim, light-<red|green|yellow|blue|magenta|cyan>,
# any of those with a bold- or dim- prefix (dim-light-blue), or a 256-color number 0-255.
# Run `tmux-tooltip --help` for the full list.

status    open          cyan
status    in_progress   yellow
status    hooked        yellow
status    blocked       red
status    deferred      dim
status    closed        green

priority  0             green
priority  1             light-green
priority  2             light-blue
priority  3             dim-light-blue
priority  4             dim-light-blue

# Scotty, one per workspace: scotty PREFIX[@DEFINITION] URL. PREFIX is the bead id prefix; add
# @DEFINITION (an ari-driving-remote definition) for a workspace on a host. URL is its Scotty project
# page copied from Scotty, https with no query. The workspace's bead links then open that page for
# the bead, which a phone can open; tmux still shows the card. No line: tmux-only links.
# Full format: bead_link.zsh --help.
scotty    beads         https://beads-43diamond.sweedler.com/p/beads
